[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sigma-fmea"
version = "0.3.0"
description = "Offline, engineering-reviewable FMEA drafts and auditable FMECA conversion"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
analysis = ["matplotlib>=3.8"]
financial = ["pandas>=2.2", "numpy>=1.26", "scipy>=1.12", "matplotlib>=3.8"]

[project.scripts]
sigma-fmea = "sigma_fmea.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
