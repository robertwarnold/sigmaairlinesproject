name: Offline Experiment Reporting
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Existing generation run with unexpired artifacts (no new generation)
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[financial]'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
          path: results/report-input
      - name: Report existing data without provider access
        run: python -m analysis.experiments report --source results/report-input --output-root results/post-report --catalog results/post-report/catalog.json --analysis-id offline-${{ github.run_id }} --skip-empty --summary-file "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiment-metrics-${{ github.run_id }}
          path: results/post-report/
          retention-days: 14
          if-no-files-found: warn
