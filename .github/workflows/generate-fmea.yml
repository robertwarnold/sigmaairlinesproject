name: Generate FMEA with shared Gemini key
run-name: ${{ (startsWith(inputs.mode, 'multi_system_') || inputs.mode == 'ce_recovery_single') && format('{0} {1} {2} ({3})', inputs.mode, inputs.batch_id, inputs.system, inputs.model) || (inputs.mode == 'single' && format('single {0} run{1} ({2})', inputs.system, inputs.run, inputs.model)) || format('{0} {1} ({2})', inputs.mode, inputs.batch_id, inputs.model) }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Select single generation, historical pilot, or fixed System A preflight/five-replicate pilot
        required: true
        default: single
        type: choice
        options:
          - single
          - pilot_plan
          - pilot_smoke
          - pilot_remaining
          - pilot_four_remaining
          - system_a_preflight
          - system_a_replicates
          - multi_system_preflight
          - multi_system_single
          - ce_recovery_single
      approved_calls:
        description: Authorization (0 for preflight; 5 for fixed System A pilot; 1/7 for historical pilot)
        default: '0'
        required: true
        type: choice
        options: ['0', '1', '5', '7']
      batch_id:
        description: System A pilot batch ID (YYYYMMDDTHHMMSSZ-unique-suffix)
        required: false
        type: string
      preflight_run_id:
        description: Successful System A preflight workflow run ID from the same commit
        required: false
        type: string
      smoke_run_id:
        description: Required for pilot_remaining; successful pilot_smoke run ID from the same source commit
        required: false
        type: string
      system:
        description: System description to analyze (uses the shared API quota)
        required: true
        type: choice
        options:
          - system_1
          - system_2_nasa_fmeca
          - system_A
          - system_B
          - system_C
          - system_D
          - system_E
      model:
        description: Gemini model ID available to the team account
        required: true
        default: gemini-3.8-flash
        type: string
      run:
        description: Replicate number for single mode (1-99); output files are named <system>_<version>_runNN
        required: false
        default: '1'
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: fmea-${{ inputs.mode }}-${{ inputs.batch_id || github.run_id }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install generator dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e '.[analysis]'
      - name: Validate fixed B-E campaign inputs
        if: ${{ startsWith(inputs.mode, 'multi_system_') || inputs.mode == 'ce_recovery_single' }}
        env:
          MODE: ${{ inputs.mode }}
          SYSTEM: ${{ inputs.system }}
          SELECTED_MODEL: ${{ inputs.model }}
          BATCH_ID: ${{ inputs.batch_id }}
          APPROVED_CALLS: ${{ inputs.approved_calls }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1 || { echo '::error::No workflow retries'; exit 1; }
          test "$SELECTED_MODEL" = gemini-3.8-flash || exit 1
          [[ "$BATCH_ID" =~ ^[A-Za-z0-9_-]+$ ]] || exit 1
          case "$SYSTEM" in system_B|system_C|system_D|system_E) ;; *) exit 1 ;; esac
          if [ "$MODE" = multi_system_single ] || [ "$MODE" = ce_recovery_single ]; then test "$APPROVED_CALLS" = 1; else test "$APPROVED_CALLS" = 0; fi
      - name: B-E model preflight without generation
        if: ${{ inputs.mode == 'multi_system_preflight' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BATCH_ID: ${{ inputs.batch_id }}
        run: python -u scripts/multi_system_pilot.py --mode remote-preflight --campaign-id "$BATCH_ID" --plan results/multi-system-preflight/plan.json
      - name: Upload B-E preflight
        if: ${{ inputs.mode == 'multi_system_preflight' }}
        uses: actions/upload-artifact@v4
        with:
          name: multi-system-preflight-${{ github.run_id }}
          path: results/multi-system-preflight/
          retention-days: 14
      - name: Restore B-E preflight
        if: ${{ inputs.mode == 'multi_system_single' || inputs.mode == 'ce_recovery_single' }}
        uses: actions/download-artifact@v4
        with:
          name: multi-system-preflight-${{ inputs.preflight_run_id }}
          run-id: ${{ inputs.preflight_run_id }}
          github-token: ${{ github.token }}
          path: results/multi-system-preflight/
      - name: Verify B-E source and reject duplicate dispatch
        if: ${{ inputs.mode == 'multi_system_single' || inputs.mode == 'ce_recovery_single' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
          BATCH_ID: ${{ inputs.batch_id }}
          SYSTEM: ${{ inputs.system }}
          MODE: ${{ inputs.mode }}
        run: |
          [[ "$PREFLIGHT_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREFLIGHT_RUN_ID" > results/multi-system-preflight/workflow.json
          python -c 'import json,os; r=json.load(open("results/multi-system-preflight/workflow.json")); assert r["conclusion"] == "success" and r["head_sha"] == os.environ["GITHUB_SHA"] and r["path"] == ".github/workflows/generate-fmea.yml"'
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/generate-fmea.yml/runs?event=workflow_dispatch&per_page=100" > results/multi-system-preflight/prior.json
          python -c 'import json,os; title=os.environ["MODE"] + " " + os.environ["BATCH_ID"] + " " + os.environ["SYSTEM"] + " (gemini-3.8-flash)"; runs=[r for p in json.load(open("results/multi-system-preflight/prior.json")) for r in p["workflow_runs"]]; assert not any(r["display_title"] == title and str(r["id"]) != os.environ["GITHUB_RUN_ID"] for r in runs), "System/campaign already dispatched; never retry"'
      - name: Generate exactly one bounded C/E recovery attempt
        if: ${{ inputs.mode == 'ce_recovery_single' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BATCH_ID: ${{ inputs.batch_id }}
          SYSTEM: ${{ inputs.system }}
        run: python -u scripts/provider_recovery.py remote --plan results/multi-system-preflight/plan.json --batch "$BATCH_ID" --system "$SYSTEM" --folder results/ce-recovery
      - name: Preserve C/E success or provider failure
        if: ${{ always() && inputs.mode == 'ce_recovery_single' }}
        uses: actions/upload-artifact@v4
        with:
          name: ce-recovery-${{ inputs.batch_id }}-${{ github.run_id }}
          path: results/ce-recovery/
          retention-days: 14
          if-no-files-found: error
      - name: Generate one campaign FMEA
        if: ${{ inputs.mode == 'multi_system_single' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BATCH_ID: ${{ inputs.batch_id }}
          SYSTEM: ${{ inputs.system }}
        run: python -u scripts/multi_system_pilot.py --mode remote-single --campaign-id "$BATCH_ID" --system "$SYSTEM" --approved-calls 1 --plan results/multi-system-preflight/plan.json
      - name: Upload this system before the next request
        if: ${{ always() && inputs.mode == 'multi_system_single' }}
        uses: actions/upload-artifact@v4
        with:
          name: multi-system-${{ inputs.batch_id }}-${{ inputs.system }}-${{ github.run_id }}
          path: results/multi-system-remote/
          retention-days: 14
          if-no-files-found: warn
      - name: Validate System A replicate authorization
        if: ${{ startsWith(inputs.mode, 'system_a_') }}
        env:
          MODE: ${{ inputs.mode }}
          APPROVED_CALLS: ${{ inputs.approved_calls }}
          ATTEMPT: ${{ github.run_attempt }}
          PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
          SYSTEM: ${{ inputs.system }}
        run: |
          test "$SYSTEM" = system_A || { echo '::error::This pilot only accepts system_A'; exit 1; }
          test "$ATTEMPT" = 1 || { echo '::error::Workflow reruns are prohibited'; exit 1; }
          if [ "$MODE" = system_a_replicates ]; then
            test "$APPROVED_CALLS" = 5 || { echo '::error::Authorize exactly five attempts'; exit 1; }
            [[ "$PREFLIGHT_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          else
            test "$APPROVED_CALLS" = 0 || exit 1
          fi
      - name: Restore frozen System A preflight
        if: ${{ inputs.mode == 'system_a_replicates' }}
        uses: actions/download-artifact@v4
        with:
          name: system-a-preflight-${{ inputs.preflight_run_id }}
          path: results/preflight
          github-token: ${{ github.token }}
          run-id: ${{ inputs.preflight_run_id }}
      - name: Verify restored preflight succeeded on this source commit
        if: ${{ inputs.mode == 'system_a_replicates' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
          CURRENT_SHA: ${{ github.sha }}
          BATCH_ID: ${{ inputs.batch_id }}
          SELECTED_MODEL: ${{ inputs.model }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREFLIGHT_RUN_ID" > results/preflight/workflow.json
          python -c 'import json,os; r=json.load(open("results/preflight/workflow.json")); assert r["conclusion"] == "success" and r["head_sha"] == os.environ["CURRENT_SHA"] and r["path"] == ".github/workflows/generate-fmea.yml"'
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/generate-fmea.yml/runs?event=workflow_dispatch&per_page=100" > results/preflight/prior-runs.json
          python -c 'import json,os; title="system_a_replicates " + os.environ["BATCH_ID"] + " (" + os.environ["SELECTED_MODEL"] + ")"; runs=[r for page in json.load(open("results/preflight/prior-runs.json")) for r in page["workflow_runs"]]; assert not any(r["display_title"] == title and str(r["id"]) != os.environ["GITHUB_RUN_ID"] for r in runs), "Batch ID was already dispatched; do not retry"'
      - name: Preflight System A without generation
        if: ${{ inputs.mode == 'system_a_preflight' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SELECTED_MODEL: ${{ inputs.model }}
          BATCH_ID: ${{ inputs.batch_id }}
        run: |
          mkdir -p results/preflight
          python scripts/single_system_replicates.py --mode preflight --model "$SELECTED_MODEL" \
            --batch-id "$BATCH_ID" --plan-file results/preflight/plan.json
      - name: Execute only the five authorized System A requests
        if: ${{ inputs.mode == 'system_a_replicates' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SELECTED_MODEL: ${{ inputs.model }}
          BATCH_ID: ${{ inputs.batch_id }}
          APPROVED_CALLS: ${{ inputs.approved_calls }}
        run: |
          python scripts/single_system_replicates.py --mode run --model "$SELECTED_MODEL" \
            --batch-id "$BATCH_ID" --approved-calls "$APPROVED_CALLS" --plan-file results/preflight/plan.json
      - name: Upload System A preflight
        if: ${{ always() && inputs.mode == 'system_a_preflight' }}
        uses: actions/upload-artifact@v4
        with:
          name: system-a-preflight-${{ github.run_id }}
          path: results/preflight/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload System A review package including failures
        if: ${{ always() && inputs.mode == 'system_a_replicates' }}
        uses: actions/upload-artifact@v4
        with:
          name: system-a-replicates-${{ github.run_id }}
          path: results/single-system-replicates/system_A/
          if-no-files-found: warn
          retention-days: 14
      - name: Validate pilot continuation input
        if: ${{ inputs.mode == 'pilot_remaining' || inputs.mode == 'pilot_four_remaining' }}
        env:
          SMOKE_RUN_ID: ${{ inputs.smoke_run_id }}
        run: |
          [[ "$SMOKE_RUN_ID" =~ ^[0-9]+$ ]] || { echo '::error::Provide the successful smoke workflow run ID'; exit 1; }
      - name: Restore smoke evidence without regenerating it
        if: ${{ inputs.mode == 'pilot_remaining' || inputs.mode == 'pilot_four_remaining' }}
        uses: actions/download-artifact@v4
        with:
          name: fmea-pilot-${{ inputs.smoke_run_id }}
          path: results/pilot
          github-token: ${{ github.token }}
          run-id: ${{ inputs.smoke_run_id }}
      - name: Generate FMEA
        if: ${{ inputs.mode == 'single' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SELECTED_SYSTEM: ${{ inputs.system }}
          SELECTED_MODEL: ${{ inputs.model }}
          SELECTED_RUN: ${{ inputs.run }}
        shell: bash
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Add the GEMINI_API_KEY repository secret under Settings > Secrets and variables > Actions."
            exit 1
          fi
          case "$SELECTED_SYSTEM" in
            system_1|system_2_nasa_fmeca|system_A|system_B|system_C|system_D|system_E) ;;
            *) echo "::error::Unknown system selection"; exit 1 ;;
          esac
          [[ "$SELECTED_RUN" =~ ^[1-9][0-9]?$ ]] || { echo "::error::Replicate number must be 1-99"; exit 1; }
          python fmea_generator.py \
            --system "system_descriptions/${SELECTED_SYSTEM}.txt" \
            --case-id "$SELECTED_SYSTEM" \
            --model "$SELECTED_MODEL" \
            --run "$SELECTED_RUN"
      - name: Run reduced research pilot
        if: ${{ inputs.mode == 'pilot_plan' || inputs.mode == 'pilot_smoke' || inputs.mode == 'pilot_remaining' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SELECTED_MODEL: ${{ inputs.model }}
          PILOT_MODE: ${{ inputs.mode }}
          APPROVED_CALLS: ${{ inputs.approved_calls }}
        run: |
          python scripts/pilot_workflow.py --mode "${PILOT_MODE#pilot_}" \
            --model "$SELECTED_MODEL" --approved-calls "$APPROVED_CALLS" --output results/pilot
      - name: Run amended four-dataset continuation
        if: ${{ inputs.mode == 'pilot_four_remaining' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SELECTED_MODEL: ${{ inputs.model }}
          APPROVED_CALLS: ${{ inputs.approved_calls }}
        run: |
          python scripts/pilot_four_datasets.py --smoke results/pilot --output results/pilot-four \
            --model "$SELECTED_MODEL" --approved-calls "$APPROVED_CALLS"
      - name: Package pilot evidence and reviewer summary
        if: ${{ always() && startsWith(inputs.mode, 'pilot_') }}
        env:
          PILOT_MODE: ${{ inputs.mode }}
        run: |
          if [ "$PILOT_MODE" = pilot_four_remaining ]; then
            python scripts/pilot_four_datasets.py --package --output results/pilot-four
          else
            python scripts/pilot_workflow.py --mode package --output results/pilot
          fi
      - name: Upload complete pilot bundle
        if: ${{ always() && startsWith(inputs.mode, 'pilot_') }}
        uses: actions/upload-artifact@v4
        with:
          name: fmea-pilot-${{ github.run_id }}
          path: ${{ inputs.mode == 'pilot_four_remaining' && 'results/pilot-four/' || 'results/pilot/' }}
          if-no-files-found: warn
          retention-days: 14
      - name: Upload generated results
        if: ${{ always() && inputs.mode == 'single' }}
        uses: actions/upload-artifact@v4
        with:
          name: fmea-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/*.csv
            results/*_raw.txt
            results/*_execution.json
          if-no-files-found: ignore
          retention-days: 14
