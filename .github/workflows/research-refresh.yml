name: Refresh sanitized research dashboard
on:
  workflow_run:
    workflows: [Generate FMEA with shared Gemini key]
    types: [requested, in_progress, completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Existing workflow artifact with identifier-only judge_import.json or generation receipts
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: research-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
      - run: python -m pip install -e '.[round2]'
      - run: Rscript -e 'install.packages(c("ggplot2", "jsonlite"), repos="https://cloud.r-project.org")'
      - name: Synchronize source execution without generating
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run_id || github.event.workflow_run.id }}
        run: |
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]] || exit 1
          python -m analysis.research sync --run-id "$SOURCE_RUN"
      - uses: actions/upload-artifact@v4
        with:
          name: sanitized-research-review-${{ github.run_id }}
          path: |
            results/research/current.json
            results/research/exports/
          retention-days: 14
      # Publication is deliberately separate: no write permission or deploy action.
      # Copy approved sanitized snapshots to permanent storage/Pages only after review.
