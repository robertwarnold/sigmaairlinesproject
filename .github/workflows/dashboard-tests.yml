name: Offline Shiny dashboard verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Install R dependencies
        run: Rscript -e 'install.packages(c("shiny","ggplot2","bslib","jsonlite","testthat"), repos="https://cloud.r-project.org")'
      - run: Rscript dashboard/tests/run.R
      - name: Parse the application and export baseline poster
        run: |
          Rscript -e 'parse("dashboard/app.R")'
          Rscript dashboard/export.R dashboard/data/baseline.json results/poster
